services:
  air-station-monthly:
    build: .
    image: air-station-monthly:latest
    container_name: air-station-monthly
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # All CSV/Parquet files and the SQLite state database live in this volume.
      - station-data:/data
    # Single instance is required: the worker, the SQLite writer and the
    # in-process download leases all assume one process. Do not scale.
    environment:
      # demo/sample only: stream tiny chunks so scripts/demo_reclaim.py can
      # show an old link being reclaimed while it downloads. Unset in prod.
      - DOWNLOAD_CHUNK_SIZE_BYTES=${DOWNLOAD_CHUNK_SIZE_BYTES:-65536}
      - DOWNLOAD_CHUNK_DELAY_SECONDS=${DOWNLOAD_CHUNK_DELAY_SECONDS:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  station-data:
